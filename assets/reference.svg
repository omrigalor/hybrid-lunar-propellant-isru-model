<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#0b1521"/><text x="55" y="65" fill="#f2f4f6" font-family="Arial" font-size="35" font-weight="700">Hybrid Lunar Propellant, Oxygen &amp; Metals Model</text><text x="55" y="104" fill="#9acfe5" font-family="Arial" font-size="18">Two resource pathways · one auditable mission-output ledger</text><g font-family="Arial" text-anchor="middle"><rect x="55" y="170" width="190" height="82" rx="16" fill="#173047" stroke="#8ed9f2"/><text x="150" y="206" fill="white" font-size="19">ICY REGOLITH</text><text x="150" y="232" fill="#a9cbdc" font-size="14">extract H₂O</text><rect x="315" y="170" width="190" height="82" rx="16" fill="#173a4e" stroke="#8ed9f2"/><text x="410" y="206" fill="white" font-size="19">WATER</text><text x="410" y="232" fill="#b9e9f7" font-size="14">purify + split</text><rect x="575" y="132" width="190" height="70" rx="16" fill="#1d4054" stroke="#8ed9f2"/><text x="670" y="175" fill="white" font-size="19">LOX · OXIDIZER</text><rect x="575" y="220" width="190" height="70" rx="16" fill="#3b3a3a" stroke="#d8c19b"/><text x="670" y="263" fill="white" font-size="19">LH₂ · FUEL</text><rect x="55" y="350" width="190" height="82" rx="16" fill="#3f3427" stroke="#e79c73"/><text x="150" y="386" fill="white" font-size="19">DRY REGOLITH</text><text x="150" y="412" fill="#efd0b8" font-size="14">melt at 1600°C</text><rect x="315" y="350" width="190" height="82" rx="16" fill="#49382f" stroke="#e79c73"/><text x="410" y="386" fill="white" font-size="19">MOLTEN OXIDE</text><text x="410" y="412" fill="#efd0b8" font-size="14">electrolyze</text><rect x="575" y="350" width="190" height="82" rx="16" fill="#31404a" stroke="#d8c19b"/><text x="670" y="386" fill="white" font-size="19">O₂ + METALS</text><text x="670" y="412" fill="#d8c19b" font-size="14">supplement + build</text><rect x="845" y="218" width="290" height="146" rx="22" fill="#142b3c" stroke="#d8c19b" stroke-width="3"/><text x="990" y="264" fill="#d8c19b" font-size="17">MISSION LEDGER</text><text x="990" y="300" fill="white" font-size="17">usable return propellant</text><text x="990" y="329" fill="white" font-size="17">excess O₂ · construction metal</text><g stroke="#d8c19b" stroke-width="4"><path d="M245 211H310"/><path d="M505 211H567"/><path d="M245 391H310"/><path d="M505 391H567"/><path d="M765 211L838 265"/><path d="M765 391L838 335"/></g></g><text x="55" y="535" fill="#aebdca" font-family="Arial" font-size="18">The model reports hydrogen as the fuel bottleneck instead of counting oxygen alone as return capability.</text></svg>
