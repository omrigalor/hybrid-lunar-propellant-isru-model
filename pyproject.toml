[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-molten-regolith-electrolysis-simulator"
version = "0.1.0"
description = "Thermal, electrochemical, and degradation simulator for oxygen and metal production from lunar regolith"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
